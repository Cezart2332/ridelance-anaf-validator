# Validatorul ANAF → Docker Hub, cu verificările de securitate după imagine.
#
#   build      mvn verify (testele pe kitul ANAF real se sar singure: kitul nu e în repo)
#   image      imaginea se construiește și urcă în Docker Hub ca `sha-<commit>`, apoi Trivy o scanează
#   după imagine, în paralel:
#     semgrep  SAST                                  — blochează pe severitate ERROR
#     codeql   SAST (Security → Code scanning)
#     gitleaks secrete în tot istoricul              — blochează pe orice găsire
#     sca      Trivy pe pom.xml                      — blochează pe CRITICAL cu fix disponibil
#     iac      Trivy config + Hadolint pe Dockerfile — doar raport
#     dast     OWASP ZAP baseline pe containerul pornit — doar raport
#   release    doar pe main: `sha-<commit>` devine `latest` și se semnează cu cosign (keyless)
#
# De setat în Settings → Secrets and variables → Actions:
#   secrets.DOCKERHUB_USERNAME   utilizatorul Docker Hub
#   secrets.DOCKERHUB_TOKEN      Personal Access Token Docker Hub, Read & Write
#   vars.DOCKERHUB_NAMESPACE     utilizatorul sau organizația sub care stă `ridelance-validator`

name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Luni dimineața: imaginea se reconstruiește pe imaginile de bază la zi și se rescanează,
    # pentru CVE-urile apărute de la ultimul push.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/ridelance-validator
  # Pe PR nu se urcă nimic (un PR dintr-un fork n-are acces la secrete): imaginea rămâne locală.
  PUSH: ${{ github.event_name != 'pull_request' }}
  TRIVY: aquasec/trivy:0.74.0
  SEMGREP: semgrep/semgrep:1.178.0
  GITLEAKS: zricethezav/gitleaks:v8.30.1
  HADOLINT: hadolint/hadolint:v2.15.1
  ZAP: zaproxy/zap-stable:2.17.0

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: mvn -B verify

  image:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image reference
        id: ref
        run: |
          if [ "$PUSH" = "true" ] && [ -z "${{ vars.DOCKERHUB_NAMESPACE }}" ]; then
            echo "::error::vars.DOCKERHUB_NAMESPACE nu e setat (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          if [ "$PUSH" = "true" ]; then
            echo "tag=$IMAGE:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ridelance-validator:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.ref.outputs.tag }}
          # SBOM și provenance ca atestări pe imagine, în Docker Hub. Pe `load` nu se pot atașa.
          sbom: ${{ env.PUSH == 'true' }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          REF: ${{ env.PUSH == 'true' && format('{0}@{1}', env.IMAGE, steps.push.outputs.digest) || steps.ref.outputs.tag }}
        run: |
          trivy() {
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/work" -w /work "$TRIVY" "$@"
          }
          trivy image --scanners vuln --format sarif --output trivy-image.sarif "$REF"
          trivy image --scanners vuln --format cyclonedx --output sbom.cdx.json "$REF"
          trivy image --scanners vuln --severity HIGH,CRITICAL --format table "$REF"
          # Poarta: CRITICAL cu fix disponibil. HIGH rămâne în raport.
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --format table "$REF"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-scan
          path: |
            trivy-image.sarif
            sbom.cdx.json
          if-no-files-found: ignore

  semgrep:
    name: SAST (Semgrep)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP" semgrep scan \
            --config p/default --config p/owasp-top-ten --config p/java \
            --config p/dockerfile \
            --metrics off --sarif --output semgrep.sarif
          errors=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "Semgrep: $errors găsiri cu severitate ERROR"
          [ "$errors" -eq 0 ]

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    name: SAST (CodeQL)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: codeql-${{ matrix.language }}

  gitleaks:
    name: Secrets (Gitleaks)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        # Același uid ca proprietarul checkout-ului, altfel git refuză repo-ul („dubious ownership").
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS" \
            git /repo --redact --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('gitleaks.sarif') != ''
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sca:
    name: Dependencies (Trivy)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        run: |
          trivy() { docker run --rm -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/work" -w /work "$TRIVY" "$@"; }
          trivy fs --scanners vuln --format sarif --output trivy-fs.sarif .
          trivy fs --scanners vuln --severity HIGH,CRITICAL --format table .
          trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --format table .

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  iac:
    name: Dockerfile (Trivy config, Hadolint)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy config
        run: |
          docker run --rm -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/work" -w /work "$TRIVY" \
            config --format sarif --output trivy-config.sarif .
          docker run --rm -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/work" -w /work "$TRIVY" \
            config --severity HIGH,CRITICAL .

      - name: Hadolint
        run: |
          docker run --rm -i "$HADOLINT" hadolint --no-fail -f sarif - < Dockerfile > hadolint.sarif
          docker run --rm -i "$HADOLINT" hadolint --no-fail - < Dockerfile

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('hadolint.sarif') != ''
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  dast:
    name: DAST (OWASP ZAP baseline)
    needs: image
    # Imaginea de pe PR n-a ieșit din jobul ei; aici se scanează doar cea urcată în Docker Hub.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start validator
        # Fără kitul ANAF validările răspund cu eroare, dar suprafața HTTP (rute, antete,
        # actuator, limite de upload) e aceeași.
        run: |
          docker run -d --name validator -p 8080:8080 "$IMAGE@${{ needs.image.outputs.digest }}"
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/actuator/health >/dev/null && exit 0; sleep 2; done
          docker logs validator; exit 1

      - name: ZAP baseline
        # Pasiv, fără atacuri. `-I`: avertismentele intră în raport, nu pică jobul.
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" "$ZAP" \
            zap-baseline.py -t http://localhost:8080 -I -r zap-report.html -J zap-report.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-report
          path: zap/
          if-no-files-found: ignore

  release:
    name: Release (latest + cosign)
    needs: [image, semgrep, codeql, gitleaks, sca]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # semnătura keyless: identitatea vine din OIDC-ul GitHub, fără cheie de ținut
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Tag latest
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@${{ needs.image.outputs.digest }}"

      - name: Sign
        run: cosign sign --yes "$IMAGE@${{ needs.image.outputs.digest }}"
